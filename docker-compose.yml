version: '3.8'

services:
  # ==============================================
  # INFRAESTRUTURA
  # ==============================================
  
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: weather_rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"       # AMQP port
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - weather-network

  mongodb:
    image: mongo:7
    container_name: weather_mongodb
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - weather-network

  # ==============================================
  # SERVIÇOS DA APLICAÇÃO
  # ==============================================

  weather-api:
    build:
      context: ./weather-api
      dockerfile: Dockerfile
    container_name: weather_api
    ports:
      - "${API_PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./weather-api/exports:/app/exports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weather-network
    restart: unless-stopped

  coleta-de-dados:
    build:
      context: ./coleta-de-dados
      dockerfile: Dockerfile
    container_name: weather_collector
    environment:
      - WEATHER_CITY=${WEATHER_CITY}
      - WEATHER_STATE=${WEATHER_STATE}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_QUEUE_NAME=${RABBITMQ_QUEUE_NAME}
      - COLLECTION_INTERVAL=${COLLECTION_INTERVAL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - weather-network
    restart: unless-stopped

  fila:
    build:
      context: ./fila
      dockerfile: Dockerfile
    container_name: weather_worker
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE_NAME=${RABBITMQ_QUEUE_NAME}
      - API_URL=${API_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      weather-api:
        condition: service_started
    networks:
      - weather-network
    restart: unless-stopped

  weather-frontend:
    build:
      context: ./weather-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: weather_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      weather-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - weather-network
    restart: unless-stopped

# ==============================================
# VOLUMES
# ==============================================
volumes:
  rabbitmq_data:
    driver: local
  mongodb_data:
    driver: local

# ==============================================
# NETWORKS
# ==============================================
networks:
  weather-network:
    driver: bridge